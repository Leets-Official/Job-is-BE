spring:
  application:
    name: job-is-be

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false

server:
  shutdown: graceful

app:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION:us-east-1}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:5m}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  oauth:
    frontend-success-uri: ${OAUTH_FRONTEND_SUCCESS_URI:http://localhost:5173/oauth/callback}
    frontend-failure-uri: ${OAUTH_FRONTEND_FAILURE_URI:http://localhost:5173/oauth/callback}
    state-ttl: ${OAUTH_STATE_TTL:5m}
    login-code-ttl: ${OAUTH_LOGIN_CODE_TTL:1m}
    connect-timeout: ${OAUTH_CONNECT_TIMEOUT:3s}
    read-timeout: ${OAUTH_READ_TIMEOUT:5s}

    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8081/api/auth/oauth/kakao/callback}
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      scopes:
        - account_email

    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/api/auth/oauth/google/callback}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
      scopes:
        - openid
        - email

jwt:
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:job-is-be}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}
  cookie-name: ${JWT_COOKIE_NAME:refreshToken}
  cookie-path: ${JWT_COOKIE_PATH:/api/auth}
  cookie-secure: ${JWT_COOKIE_SECURE:false}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: list
    tags-sorter: alpha
    operations-sorter: alpha

  api-docs:
    path: /v3/api-docs
    enabled: true

crawler:
  python-path: ${PYTHON_PATH:python3}
  script-path: ${CRAWLER_SCRIPT_PATH:database/scripts/run_pipeline.py}

  company-output-path: ${COMPANY_OUTPUT_PATH:database/data/companies.jsonl}
  job-output-path: ${JOB_OUTPUT_PATH:database/data/job_postings.jsonl}

matching:
  database-url: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
